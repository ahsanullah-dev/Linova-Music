services:
  - type: web
    name: linova-music
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MUSIC_PROVIDER
        value: global
      - key: YOUTUBE_MUSIC_ENABLED
        value: true
      - key: JWT_SECRET
        generateValue: true
